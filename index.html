const KEYS_LO = 48, KEYS_HI = 96; // 下の鍵盤の音域（C3〜C7）
function renderPiano() {
  const sec = curSec(), key = secKey(sec);
  const info = focusInfo();
  const scale = new Set([0, 2, 4, 5, 7, 9, 11].map(x => (key.pc + x) % 12));
  const tones = new Set(info ? info.pcs : []);
  const avoid = new Set([...scale].filter(p => !tones.has(p) && tones.has((p + 11) % 12)));
  const down = new Set(Object.values(held).map(h => h.m));
  const keyChar = {};
  for (const [k, v] of Object.entries(KEYMAP)) keyChar[ui.oct + v] = k.toUpperCase();
  $('#pianoTitle').textContent = `鍵盤（${info ? info.name + ' ／ ' : ''}${key.name}）`;
  renderDiagram(info);

  const root = $('#piano');
  root.innerHTML = '';
  const whites = [];
  for (let m = KEYS_LO; m <= KEYS_HI; m++) if (NAT.includes(m % 12)) whites.push(m);
  const w = 100 / whites.length;
  const cls = m => {
    const pc = m % 12;
    return (tones.has(pc) ? ' tone' : avoid.has(pc) ? ' avoid' : scale.has(pc) ? ' ok' : '') + (down.has(m) ? ' down' : '')
      + (keyChar[m] ? ' pcmap' : '');
  };
  const bind = (el, m) => {
    el.onpointerdown = e => { e.preventDefault(); noteOn('p' + m, m); };
    el.onpointerup = el.onpointerleave = () => noteOff('p' + m);
  };
  whites.forEach((m, i) => {
    const el = document.createElement('div');
    el.className = 'wk' + cls(m);
    el.innerHTML = `<span class="pc">${m % 12 === 0 ? 'C' + (m / 12 - 1) : PC_NAME[m % 12]}</span>${keyChar[m] || ''}`;
    bind(el, m);
    root.appendChild(el);
    const b = m + 1;
    if (b <= KEYS_HI && !NAT.includes(b % 12)) {
      const bk = document.createElement('div');
      bk.className = 'bk' + cls(b);
      bk.style.left = `calc(${(i + 1) * w}% - ${w * 0.3}%)`;
      bk.style.width = w * 0.6 + '%';
      bk.innerHTML = keyChar[b] || '';
      bind(bk, b);
      root.appendChild(bk);
    }
  });
}

function renderDiagram(info) {
  const box = $('#gdiag');
  if (!isGuitar() || !info) { box.innerHTML = ''; return; }
  const shape = guitarShape(info);
  if (!shape) { box.innerHTML = `${info.name}<br>押さえ方が見つかりません`; return; }
  const fretted = shape.frets.filter(f => f > 0);
  const hiF = fretted.length ? Math.max(...fretted) : 0;
  const start = hiF <= 4 ? 1 : Math.min(...fretted);
  const X = s => 14 + s * 14, Y = f => 22 + (f - start + 0.5) * 18;
  let svg = `<svg width="100" height="126" viewBox="0 0 100 126" fill="none" stroke="currentColor">`;
  svg += `<rect x="14" y="22" width="70" height="90" stroke-width="1"/>`;
  if (start === 1) svg += `<line x1="14" y1="22" x2="84" y2="22" stroke-width="4"/>`;
  for (let f = 1; f < 5; f++) svg += `<line x1="14" y1="${22 + f * 18}" x2="84" y2="${22 + f * 18}"/>`;
  for (let s = 1; s < 5; s++) svg += `<line x1="${X(s)}" y1="22" x2="${X(s)}" y2="112"/>`;
  shape.frets.forEach((f, s) => {
    if (f < 0) svg += `<text x="${X(s)}" y="16" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">×</text>`;
    else if (f === 0) svg += `<circle cx="${X(s)}" cy="12" r="4"/>`;
    else svg += `<circle cx="${X(s)}" cy="${Y(f)}" r="5.5" fill="currentColor"/>`;
  });
  if (start > 1) svg += `<text x="90" y="${Y(start) + 4}" font-size="10" fill="currentColor" stroke="none">${start}</text>`;
  svg += '</svg>';
  box.innerHTML = svg + info.name;
}

const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

// ================= 歌詞 =================
// 日本語の歌は「1音符＝1モーラ」が基本。歌詞をモーラ（音符に載せる単位）に分ける
const SMALL_KANA = 'ぁぃぅぇぉゃゅょゎゕゖァィゥェォャュョヮヵヶ';
const EXT_KANA = 'っッー〜～';
const SKIP_CHARS = /[\s、。，．,.!?！？「」『』（）()・…‥〜"'“”‘’]/u;
const HAN = /\p{sc=Han}|[々〆]/u;

function parseLyrics(text, countExt) {
  let noReading = 0;
  const lines = (text || '').split('\n').map(line => {
    const mora = [];
    const push = u => { if (u) mora.push(u); };
    const addKana = s => {
      for (const ch of s) {
        if (SKIP_CHARS.test(ch)) continue;
        if (mora.length && (SMALL_KANA.includes(ch) || (!countExt && EXT_KANA.includes(ch)))) mora[mora.length - 1] += ch;
        else push(ch);
      }
    };
    // 「漢字(よみ)」／ 英単語（ハイフンで分割）／ それ以外は1文字ずつ
    const re = /((?:\p{sc=Han}|[々〆])+)[(（]([^)）]*)[)）]|[A-Za-z'’]+(?:-[A-Za-z'’]+)*|./gsu;
    for (const m of line.matchAll(re)) {
      if (m[1] !== undefined) addKana(m[2]);
      else if (/^[A-Za-z]/.test(m[0])) m[0].split('-').forEach(push);
      else if (HAN.test(m[0])) { push(m[0]); noReading++; }
      else addKana(m[0]);
    }
    return { text: line, mora };
  });
  return { lines, all: lines.flatMap(l => l.mora), noReading };
}

// メロディの音符（時間順）に、歌詞のモーラを先頭から1つずつ割り当てる。戻り値は sec.melody と同じ並び
// 何番の歌詞か（書いていない番は空）
const verseText = (sec, v = ui.verse) => (sec.verses || [])[v] || '';
// その番が曲の並びに何回出てくるか、歌詞が何番まであるか、の多い方
const verseCount = sec => Math.max(1, song.arrangement.filter(x => x === sec.id).length, (sec.verses || []).length);

// 音符（時間順）に歌詞のモーラを先頭から1つずつ付ける。「のばし」の音（tie）は歌詞を使わず、前の音の続きとして「ー」
// labels は sec.melody と同じ並びで {text, line, first, tie}（歌詞が足りない音は null）
function lyricMap(sec, v = ui.verse) {
  const p = parseLyrics(verseText(sec, v), song.lyrExt);
  const flat = [];
  p.lines.forEach((l, li) => l.mora.forEach((m, k) => flat.push({ text: m, line: li, first: k === 0 })));
  const order = sec.melody.map((n, i) => i).sort((a, b) => sec.melody[a].t - sec.melody[b].t || sec.melody[b].m - sec.melody[a].m);
  const labels = new Array(sec.melody.length).fill(null);
  let used = 0;
  for (const idx of order) {
    if (sec.melody[idx].tie) labels[idx] = { text: 'ー', tie: true };
    else if (used < flat.length) labels[idx] = flat[used++];
  }
  return { flat, labels, order, used };
}
function lyricsFor(sec, v = ui.verse) { return lyricMap(sec, v).labels.map(l => l && !l.tie ? l.text : ''); }
// 時刻 t に新しく音を置いたら付く歌詞（t より前にある、のばしでない音の数で決まる）
function moraAt(sec, t) {
  const L = lyricMap(sec);
  return L.flat[sec.melody.filter(n => !n.tie && n.t < t).length] || null;
}

function renderLyrics() {
  const sec = curSec();
  const n = verseCount(sec);
  if (ui.verse >= n) ui.verse = 0;
  $('#lyrTitle').textContent = n > 1 ? `歌詞（${sec.name}・${ui.verse + 1}番）` : `歌詞（${sec.name}）`;
  const seg = $('#verseSeg');
  seg.innerHTML = '';
  if (n > 1) for (let v = 0; v < n; v++) {
    const b = document.createElement('button');
    b.textContent = `${v + 1}番`;
    if (v === ui.verse) b.className = 'on';
    b.onclick = () => { ui.verse = v; ui.note = -1; render(); };
    seg.appendChild(b);
  }
  const ta = $('#lyrics');
  if (document.activeElement !== ta && ta.value !== verseText(sec)) ta.value = verseText(sec);
  $('#lyrExt').checked = !!song.lyrExt;
  const p = parseLyrics(verseText(sec), song.lyrExt);
  const box = $('#lyrInfo');
  if (!p.all.length) { box.innerHTML = '歌詞を書くと、音の数とメロディの音符の数を比べられます。'; return; }
  const ties = sec.melody.filter(x => x.tie).length;
  const nNotes = sec.melody.length - ties, diff = p.all.length - nNotes;
  const cmp = !nNotes ? 'メロディはまだありません'
    : diff === 0 ? 'ぴったりです'
    : diff > 0 ? `<span class="warn">音符があと${diff}個足りません</span>` : `音符が${-diff}個余っています`;
  let html = `歌詞 <b>${p.all.length}音</b> ／ メロディ <b>${nNotes}音</b>${ties ? `＋のばし${ties}` : ''}（${cmp}）`;
  if (p.noReading) html += `<br><span class="warn">読みのない漢字が${p.noReading}字あります（1字1音で数えています）</span>`;
  html += '<br>' + p.lines.map((l, i) => l.mora.length ? `${i + 1}行目 ${l.mora.length}音` : '').filter(Boolean).join('・');
  // 同じメロディで歌う他の番の音の数も並べる（番ごとにずれていないかを見る）
  if (n > 1) html += '<br>' + Array.from({ length: n }, (_, v) => `${v + 1}番 ${parseLyrics(verseText(sec, v), song.lyrExt).all.length}音`).join('・');
  box.innerHTML = html;
}

// ---- 曲全体の歌詞（空行で区切ったブロックを、セクションの1番・2番…に割り当てる） ----
const TAG_RE = /^\s*[\[【［<＜]\s*(.+?)\s*[\]】］>＞]\s*$/;
const INSTRUMENTAL = /イントロ|間奏|アウトロ|ソロ|intro|interlude|outro|solo/i;
function normLabel(s) {
  s = s.replace(/^\d+\s*番\s*/, '').trim();
  if (/^(A|Aメロ|verse)$/i.test(s)) return 'Aメロ';
  if (/^(B|Bメロ|pre[- ]?chorus)$/i.test(s)) return 'Bメロ';
  if (/^(サビ|chorus|hook)$/i.test(s)) return 'サビ';
  if (/^(C|Cメロ|bridge)$/i.test(s)) return 'Cメロ';
  return s;
}

// ブロック＝ {tag: 見出し(なければnull), tagLine: 見出しの行番号, start: 最初の歌詞の行番号, lines: 歌詞の行}
function parseSongLyrics(text) {
  const blocks = [];
  let cur = null;
  const close = () => { if (cur && (cur.tag !== null || cur.lines.length)) blocks.push(cur); cur = null; };
  text.replace(/\r/g, '').split('\n').forEach((ln, i) => {
    const m = ln.match(TAG_RE);
    if (m) { close(); cur = { tag: normLabel(m[1]), tagLine: i, start: i + 1, lines: [] }; return; }
    // 空行でブロックを閉じる。見出しの直後の空行は閉じない（[Aメロ]→空行→歌詞 の書き方もあるため）が、
    // イントロ・間奏など歌のない見出しは空行で閉じる
    if (!ln.trim()) { if (cur && (cur.lines.length || INSTRUMENTAL.test(cur.tag || ''))) close(); return; }
    if (!cur) cur = { tag: null, tagLine: null, start: i, lines: [] };
    cur.lines.push(ln.trim());
  });
  close();
  return blocks;
}

// 見出しのないブロックに、よくある J-POP の構成から推測した名前を付ける。
// 似たブロック（同じ行が半分以上）が他にもあればサビ、その間は Aメロ・Bメロ、2回目のサビの後の1ブロックは Cメロ
function autoLabels(blocks) {
  const norm = l => l.replace(/[\s、。，．,.!?！？]/g, '');
  const sets = blocks.map(b => new Set(b.lines.map(norm)));
  const sim = (a, b) => { let c = 0; for (const x of a) if (b.has(x)) c++; return c / Math.max(1, Math.min(a.size, b.size)); };
  // 似たブロックをグループにまとめ、いちばん多く繰り返されるグループ（同数なら曲の後ろにあるほう）をサビとみなす
  const group = blocks.map(() => -1);
  let g = 0;
  blocks.forEach((b, i) => {
    if (!b.lines.length || group[i] >= 0) return;
    group[i] = g;
    blocks.forEach((o, j) => { if (j > i && group[j] < 0 && o.lines.length && sim(sets[i], sets[j]) >= 0.5) group[j] = g; });
    g++;
  });
  let best = -1, bestCount = 1, bestLast = -1;
  for (let k = 0; k < g; k++) {
    const idx = group.map((x, i) => x === k ? i : -1).filter(i => i >= 0);
    const last = idx[idx.length - 1];
    if (idx.length > bestCount || (idx.length === bestCount && best >= 0 && last > bestLast)) { best = k; bestCount = idx.length; bestLast = last; }
  }
  const chorus = group.map(x => best >= 0 && x === best);
  const labels = blocks.map(b => b.tag);
  if (!chorus.some(Boolean)) {
    const cyc = ['Aメロ', 'Bメロ', 'サビ'];
    let k = 0;
    blocks.forEach((b, i) => { if (!labels[i]) labels[i] = cyc[k++ % 3]; });
    return labels;
  }
  let run = [], choruses = 0;
  const flush = () => {
    const n = run.length;
    const names = n === 1 ? [choruses >= 2 ? 'Cメロ' : 'Aメロ'] : [...Array(Math.max(0, n - 1)).fill('Aメロ'), 'Bメロ'];
    run.forEach((i, k) => { labels[i] = names[k]; });
    run = [];
  };
  blocks.forEach((b, i) => {
    if (b.tag === 'サビ' || (!b.tag && chorus[i])) { flush(); labels[i] = 'サビ'; choruses++; }
    else if (!b.tag) run.push(i);
  });
  flush();
  return labels;
}

// ブロックの見出し行を書き換える（labels[i] が undefined なら変えない、'' なら見出しを消す）
function writeLabels(text, labels) {
  const lines = text.replace(/\r/g, '').split('\n');
  const blocks = parseSongLyrics(text);
  for (let i = blocks.length - 1; i >= 0; i--) {
    const b = blocks[i], l = labels[i];
    if (l === undefined || l === b.tag) continue;
    if (b.tagLine !== null) { if (l) lines[b.tagLine] = `[${l}]`; else lines.splice(b.tagLine, 1); }
    else if (l) lines.splice(b.start, 0, `[${l}]`);
  }
  return lines.join('\n');
}

// 今の曲の並びどおりに、見出し付きで歌詞全体を組み立てる
function songLyricsText() {
  const ids = song.arrangement.length ? song.arrangement : song.sections.map(s => s.id);
  const seen = {};
  return ids.map(sid => {
    const sec = secById(sid);
    const v = seen[sid] = (seen[sid] ?? -1) + 1;
    const txt = verseText(sec, v).trim();
    return `[${sec.name}]` + (txt ? '\n' + txt : '');
  }).join('\n\n');
}

const labelColor = name => {
  const sec = song.sections.find(s => s.name === name);
  if (sec) return secColor(sec.id);
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.codePointAt(0)) % 360;
  return `hsl(${h} 60% 55%)`;
};

function renderSongBlocks() {
  const ta = $('#songLyrics');
  const blocks = parseSongLyrics(ta.value);
  const box = $('#lyrBlocks');
  box.innerHTML = '';
  const names = [...new Set([...song.sections.map(s => s.name), 'Aメロ', 'Bメロ', 'サビ', 'Cメロ', '大サビ', 'イントロ', '間奏', 'アウトロ'])];
  const seen = {};
  blocks.forEach((b, i) => {
    const v = b.tag ? (seen[b.tag] = (seen[b.tag] ?? -1) + 1) : 0;
    const el = document.createElement('div');
    el.className = 'blk' + (b.tag ? '' : ' none');
    if (b.tag) el.style.borderLeftColor = labelColor(b.tag);
    const opts = ['<option value="">未指定</option>',
      ...names.map(n => `<option${n === b.tag ? ' selected' : ''}>${esc(n)}</option>`),
      b.tag && !names.includes(b.tag) ? `<option selected>${esc(b.tag)}</option>` : '',
      '<option value="__other">その他の名前…</option>'].join('');
    const mora = parseLyrics(b.lines.join('\n'), song.lyrExt).all.length;
    el.innerHTML = `<div class="top"><span class="no">${i + 1}</span><select>${opts}</select>${b.tag && v ? `<span class="small">${v + 1}番</span>` : ''}<span class="meta">${b.lines.length}行・${mora}音</span></div>
      <div class="prev${b.lines.length ? '' : ' empty'}">${b.lines.length ? esc(b.lines[0]) : '（歌詞なし）'}</div>`;
    const sel = el.querySelector('select');
    sel.onclick = e => e.stopPropagation();
    sel.onchange = () => {
      let l = sel.value;
      if (l === '__other') { l = prompt('セクション名', ''); if (!l) { renderSongBlocks(); return; } }
      const labels = []; labels[i] = l;
      ta.value = writeLabels(ta.value, labels);
      renderSongBlocks();
    };
    // クリックで、左の歌詞のそのブロックへ移動
    el.onclick = () => {
      const lines = ta.value.split('\n');
      const line = b.tagLine ?? b.start;
      const pos = lines.slice(0, line).reduce((a, x) => a + x.length + 1, 0);
      ta.focus();
      ta.setSelectionRange(pos, pos);
      ta.scrollTop = line * parseFloat(getComputedStyle(ta).lineHeight) - 20;
    };
    box.appendChild(el);
  });
  const none = blocks.filter(b => !b.tag).length;
  $('#lyrModalInfo').textContent = blocks.length ? `${blocks.length}ブロック${none ? `（未指定 ${none}）` : ''}` : '';
}

function openSongLyrics() {
  const hasAny = song.sections.some(s => (s.verses || []).some(v => v && v.trim()));
  $('#songLyrics').value = hasAny ? songLyricsText() : '';
  $('#lyrModal').hidden = false;
  renderSongBlocks();
  $('#songLyrics').focus();
}
function closeSongLyrics() { $('#lyrModal').hidden = true; }

function applySongLyrics() {
  const ta = $('#songLyrics');
  let blocks = parseSongLyrics(ta.value);
  if (!blocks.length) { alert('歌詞がありません。'); return; }
  if (blocks.some(b => !b.tag)) {
    ta.value = writeLabels(ta.value, autoLabels(blocks));
    blocks = parseSongLyrics(ta.value);
    renderSongBlocks();
  }
  if (!confirm(`${blocks.length}ブロックを反映します。\n曲の並びは歌詞の順に置き換わります：\n${blocks.map(b => b.tag).join(' → ')}\n\n（反映後も ↶ で元に戻せます）`)) return;
  const touched = new Set(), seen = {}, arr = [];
  for (const b of blocks) {
    let sec = song.sections.find(x => x.name === b.tag);
    if (!sec) { sec = mkSec(newSecId(), b.tag); song.sections.push(sec); }
    if (!touched.has(sec.id)) { sec.verses = []; touched.add(sec.id); }
    const v = seen[sec.id] = (seen[sec.id] ?? -1) + 1;
    sec.verses[v] = b.lines.join('\n');
    arr.push(sec.id);
  }
  song.arrangement = arr;
  song.current = arr[0];
  ui.verse = 0; ui.sel = -1; ui.note = -1;
  closeSongLyrics();
  changed();
  setSideTab('lyrics');
}

// ================= 書き出し =================
function vlq(n) {
  const b = [n & 0x7f];
  while ((n >>= 7)) b.unshift((n & 0x7f) | 0x80);
  return b;
}
const u32 = n => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255];
const ascii = s => [...s].map(c => c.charCodeAt(0));
const utf8 = s => [...new TextEncoder().encode(s)];
const meta = (tick, type, bytes) => ({ tick, pri: 0, data: [0xff, type, ...vlq(bytes.length), ...bytes] });

function track(name, evs) {
  evs.unshift(meta(0, 0x03, utf8(name)));
  evs.sort((a, b) => a.tick - b.tick || a.pri - b.pri);
  const d = [];
  let last = 0;
  for (const e of evs) { d.push(...vlq(e.tick - last), ...e.data); last = e.tick; }
  d.push(0, 0xff, 0x2f, 0);
  return [...ascii('MTrk'), ...u32(d.length), ...d];
}

function noteEvs(evs, ch, m, t, d, vel) {
  const PPQ = 480;
  const a = Math.round(t * PPQ), b = Math.max(a + 1, Math.round((t + d) * PPQ) - 1);
  evs.push({ tick: a, pri: 2, data: [0x90 | ch, m, vel] }, { tick: b, pri: 1, data: [0x80 | ch, m, 0] });
}

function exportMidi() {
  const plan = buildPlan(song.arrangement.length ? song.arrangement : song.sections.map(s => s.id));
  if (!plan.total) { alert('書き出すコードがありません'); return; }
  const tempo = Math.round(60000000 / song.bpm);
  const cond = [meta(0, 0x51, [(tempo >> 16) & 255, (tempo >> 8) & 255, tempo & 255]), meta(0, 0x58, [4, 2, 24, 8])];
  plan.markers.forEach(mk => cond.push(meta(Math.round(mk.t * 480), 0x06, utf8(mk.name))));
  const chords = [{ tick: 0, pri: 0, data: [0xc0, inst().prog] }], bass = [{ tick: 0, pri: 0, data: [0xc1, 33] }];
  for (const e of plan.evs) {
    chords.push(meta(Math.round(e.t * 480), 0x01, utf8(e.info.name)));
    (e.v.guitar ? e.v.guitar.notes : e.v.notes).forEach(n => noteEvs(chords, 0, n, e.t, e.beats, 80));
    noteEvs(bass, 1, e.v.bass, e.t, e.beats, 90);
  }
  const tracks = [track(song.title, cond), track('Chords', chords), track('Bass', bass)];
  if (plan.mel.length) {
    const mel = [{ tick: 0, pri: 0, data: [0xc2, 0] }];
    plan.mel.forEach(n => {
      if (n.lyric) mel.push(meta(Math.round(n.t * 480), 0x05, utf8(n.lyric))); // 歌詞イベント（DAWで歌詞として表示される）
      noteEvs(mel, 2, n.m, n.t, n.d, 100);
    });
    tracks.push(track('Melody', mel));
  }
  if (song.drums) {
    const dr = [];
    drumHits(plan.total).forEach(h => noteEvs(dr, 9, h.n, h.t, 0.25, h.n === 42 ? Math.round(h.v * 700) : 100));
    tracks.push(track('Drums', dr));
  }
  const bytes = [...ascii('MThd'), ...u32(6), 0, 1, 0, tracks.length, 480 >> 8, 480 & 255, ...tracks.flat()];
  download(new Blob([new Uint8Array(bytes)], { type: 'audio/midi' }), song.title + '.mid');
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function chordText() {
  const lines = [`${song.title}（${keyInfo(song.tonic, song.mode).name} / BPM ${song.bpm}）`, ''];
  const ids = song.arrangement.length ? song.arrangement : song.sections.map(s => s.id);
  const seen = {};
  for (const sid of ids) {
    const sec = secById(sid), key = secKey(sec);
    const v = seen[sid] = (seen[sid] ?? -1) + 1;
    const head = `【${sec.name}${v ? `・${v + 1}番` : ''}】${sec.shift ? `（${key.name}）` : ''}`;
    const body = sec.chords.map(c => chordInfo(c, key).name + (c.beats !== 4 ? `(${beatsLabel(c.beats)})` : '')).join(' | ');
    lines.push(head, body ? '| ' + body + ' |' : '（未入力）');
    if (verseText(sec, v).trim()) lines.push('', ...verseText(sec, v).trim().split('\n'));
    lines.push('');
  }
  return lines.join('\n');
}

$('#addSec').onchange = e => {
  const base = e.target.value;
  e.target.value = '';
  if (!base) return;
  let name = base, n = 2;
  while (song.sections.some(s => s.name === name)) name = base + n++;
  const id = newSecId();
  song.sections.push(mkSec(id, name));
  song.arrangement.push(id);
  selectSection(id);
};
$('#addArr').onchange = e => { if (e.target.value) song.arrangement.push(e.target.value); e.target.value = ''; changed(); };

$('#playSec').onclick = () => play('section');
$('#playSong').onclick = () => play('song');

$('#redoBtn').onclick = () => restore(1);
$('#clear').onclick = () => {
  const s = curSec();
  if (s.melody.length && !confirm('メロディも消えます。クリアしますか？（↶ で元に戻せます）')) return;

};
$('#fancy').onclick = () => {
  const ch = curSec().chords;
  ch.forEach((c, i) => {
    const q = getChord(c.id).q;
    if (c.id === 'V' && ch[i + 1] && fam(ch[i + 1].id) === 'I') { c.id = 'IV/V'; c.ext = ''; return; }
    if (!c.ext && ['maj', 'm'].includes(q) && !getChord(c.id).bass) c.ext = '7';
  });
  changed();
};

$('#auto1').onclick = () => choose(pickRandom(candidates(candContext())));
$('#auto4').onclick = () => {

};

};

// ファイルメニュー（項目を選んだら閉じる）
const closeMenu = () => $('#fileMenu').removeAttribute('open');
// メニューが画面の外にはみ出さない向きに開く
$('#fileMenu').addEventListener('toggle', () => {
  const m = $('#fileMenu');
  if (!m.open) return;
  m.classList.remove('left');
  const body = m.querySelector('.menu-body');
  if (body.getBoundingClientRect().left < 8) m.classList.add('left');
});
document.addEventListener('click', e => { if (!e.target.closest('#fileMenu')) closeMenu(); });
$('#midi').onclick = () => { closeMenu(); exportMidi(); };
$('#copyText').onclick = async () => {
  closeMenu();

  catch (e) { prompt('コピーしてください', chordText()); }
  setTimeout(setStatus, 2000);
};
$('#saveJson').onclick = () => { closeMenu(); download(new Blob([JSON.stringify(song, null, 2)], { type: 'application/json' }), song.title + '.json'); };
$('#loadJson').onclick = () => { closeMenu(); $('#file').click(); };
$('#file').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.sections) || !data.sections.length) throw new Error('形式が違います');
    stop();
    song = migrate({ ...newSong(), ...data });
    ui.sel = -1; ui.note = -1;
    changed();
  } catch (err) {
    alert('読み込めませんでした：' + err.message);
  }
};
$('#newSong').onclick = () => {
  closeMenu();
  if (!confirm('新しい曲を始めますか？（今の曲は「ファイルに保存」していなければ消えます）')) return;

};

// ピアノロール
const roll = $('#roll');
roll.addEventListener('pointerdown', e => { rollDown(e); renderCands(); renderPiano(); });
roll.addEventListener('pointermove', rollMove);
roll.addEventListener('pointerup', rollUp);
roll.addEventListener('pointercancel', rollUp);
roll.addEventListener('dblclick', e => {
  const { beat, midi } = rollPos(e);
  const i = hitNote(curSec(), beat, midi);
  if (i >= 0) removeNote(i);
});
roll.addEventListener('contextmenu', e => e.preventDefault());
roll.addEventListener('pointerleave', () => { if (ui.hover) { ui.hover = null; renderRoll(); } });
$('#rollbox').addEventListener('scroll', () => { $('.gut-keys').scrollTop = $('#rollbox').scrollTop; });
$('.gut-keys').addEventListener('wheel', e => { $('#rollbox').scrollTop += e.deltaY; e.preventDefault(); }, { passive: false });
// 歌詞レーン：クリックでその音を選ぶ、ダブルクリックで「のばし」を切り替え
$('#lane').addEventListener('click', e => {
  const i = laneHit(e);
  if (i < 0) return;
  ui.note = i; ui.sel = -1;
  tapNote(curSec().melody[i].m);
  render();
});
$('#lane').addEventListener('dblclick', e => { const i = laneHit(e); if (i >= 0) toggleTie(i); });

// 画面の大きさが変わったら、コードトラックとピアノロールを描き直す
new ResizeObserver(() => { if (!drag) renderSection(); }).observe($('#scroller'));

// ボタンにフォーカスが残るとスペースキーで二重に押されるので外す
document.addEventListener('click', e => { if (e.target.closest('button')) e.target.closest('button').blur(); });

window.addEventListener('keydown', e => {
  if (!$('#lyrModal').hidden) { if (e.key === 'Escape') closeSongLyrics(); return; }
  const el = e.target;
  if (el.tagName === 'SELECT' || el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && !['range', 'checkbox'].includes(el.type))) return;
  const k = e.key.toLowerCase();
  if ((e.metaKey || e.ctrlKey) && k === 'z') { e.preventDefault(); restore(e.shiftKey ? 1 : -1); return; }
  if ((e.metaKey || e.ctrlKey) && k === 'y') { e.preventDefault(); restore(1); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const sec = curSec();
  const n = sec.melody[ui.note];
  if (e.code === 'Space') { e.preventDefault(); play(e.shiftKey ? 'song' : 'section'); return; }
  if (/^[1-9]$/.test(e.key)) {
    const c = candidates(candContext())[+e.key - 1];
    if (c) choose(c.id);
    return;
  }
  if (k === 'backspace' || k === 'delete') {
    e.preventDefault();
    if (n) removeNote(ui.note);
    else if (ui.sel >= 0) removeAt(ui.sel);
    else if (sec.chords.length) removeAt(sec.chords.length - 1);
    return;
  }
  if (n && (k === 'arrowup' || k === 'arrowdown')) {
    e.preventDefault();
    n.m = Math.min(108, Math.max(21, n.m + (k === 'arrowup' ? 1 : -1) * (e.shiftKey ? 12 : 1)));
    tapNote(n.m);
    changed();
    return;
  }
  if (n && (k === 'arrowleft' || k === 'arrowright')) {
    e.preventDefault();
    const total = secBeats(sec);
    n.t = Math.min(total - ui.snap, Math.max(0, n.t + (k === 'arrowleft' ? -ui.snap : ui.snap)));
    n.d = Math.min(n.d, total - n.t);
    changed();
    return;
  }
  if (k === 'arrowleft' || k === 'arrowright') {
    if (!sec.chords.length) return;
    e.preventDefault();
    const len = sec.chords.length;
    ui.sel = ui.sel < 0 ? len - 1 : (ui.sel + (k === 'arrowleft' ? len - 1 : 1)) % len;
    ui.note = -1;
    preview(sec.chords[ui.sel]);
    render();
    return;
  }
  if (k === 'escape') { ui.sel = -1; ui.note = -1; closeMenu(); render(); return; }
  if (k === 'r') { toggleRec(); return; }
  if (k === '-' && n) { toggleTie(ui.note); return; }
  if (k === 'z') { ui.oct = Math.max(KEYS_LO, ui.oct - 12); renderPiano(); return; }
  if (k === 'x') { ui.oct = Math.min(KEYS_HI - 12, ui.oct + 12); renderPiano(); return; } // 弾ける範囲の始まりは C3〜C6
  if (k in KEYMAP) { e.preventDefault(); if (!e.repeat) noteOn(k, ui.oct + KEYMAP[k]); }
});
window.addEventListener('keyup', e => noteOff(e.key.toLowerCase()));
window.addEventListener('blur', () => Object.keys(held).forEach(noteOff));

try { dockOpen = localStorage.getItem('chord-maker-dock') !== '0'; } catch (e) { /* 既定は表示 */ }
setDock(dockOpen);

snapshot();
setStatus();
render();
